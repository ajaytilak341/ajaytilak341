  <linearGradient id="disk" x1="0" x2="1"><stop stop-color="#8d4a19" stop-opacity=".05"/><stop offset=".28" stop-color="#ffd58d"/><stop offset=".5" stop-color="#fff8df"/><stop offset=".72" stop-color="#f5a64c"/><stop offset="1" stop-color="#8d4a19" stop-opacity=".05"/></linearGradient>
  <linearGradient id="ring" x1="0" x2="1"><stop stop-color="#7a3e16"/><stop offset=".45" stop-color="#ffe2a9"/><stop offset=".7" stop-color="#f4a94f"/><stop offset="1" stop-color="#6c3717"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
