<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Ajay Tilak V — Singularity Mission Control</title>
<desc id="desc">A cinematic golden black hole and accretion disk on a dark starfield, with a minimal mission-control interface.</desc>
<defs>
